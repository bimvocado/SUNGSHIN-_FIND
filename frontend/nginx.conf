# Nginx 웹 서버 및 /api 라우팅 설정

server {
    listen 80;

    # / 으로 들어오는 일반 화면 요청 처리
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # /api 로 들어오는 모든 API 요청 처리
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}