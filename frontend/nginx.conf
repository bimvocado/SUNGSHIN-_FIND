# Nginx 웹 서버 및 /api 라우팅 설정

server {
    listen 80;

    # / 으로 들어오는 일반 화면 요청 처리
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # /api 로 들어오는 모든 API 요청 처리
    location /api {
        # 사용자 정의 네트워크에 내장된 DNS 서버를 사용해서 30초 주기로 컨테이너 IP 갱신하도록 지정
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}