# frontend/backend 네임 스페이스 dev로 띄웠기 때문에 꼭 -n dev에 배포해야 됨!

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sungshin-find-ingress
  labels:
    app: sungshin-find
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80